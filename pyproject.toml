[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asustor-nas-cli"
dynamic = ["version"]
description = "Safety-first ASUSTOR ADM CLI and read-only MCP for NAS diagnostics, UPS and network observations, DeadBolt checks, report comparison, and guarded platform-module management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

keywords = ["asustor", "adm", "nas", "cli", "mcp", "security", "ransomware", "deadbolt"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["jsonschema>=4.26,<5"]

[project.urls]
Homepage = "https://github.com/popuchoco/asustor-nas-cli"
Repository = "https://github.com/popuchoco/asustor-nas-cli"
Issues = "https://github.com/popuchoco/asustor-nas-cli/issues"

[project.scripts]
adm = "asustor_nas_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "asustor_nas_cli.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
