[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asustor-nas-cli"
version = "0.1.0"
description = "Read-only diagnostic CLI for ASUSTOR ADM NAS devices"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adm = "asustor_nas_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
