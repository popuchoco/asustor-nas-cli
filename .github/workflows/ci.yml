name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --editable '.[test]'

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose

  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install built package and test tools
        run: python -m pip install '.[test]'

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Verify installed command
        run: adm --version

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: check .

  package-build:
    name: Build and install wheel / Python 3.14
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check --strict dist/*

      - name: Install built wheel and smoke-test the command
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          adm --version
          python -c "import subprocess; from asustor_nas_cli import __version__; assert subprocess.check_output(['adm', '--version'], text=True).strip() == f'adm {__version__}'"

      - name: Store CI distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
